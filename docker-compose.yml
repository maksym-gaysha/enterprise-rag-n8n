services:
  postgres-db:
    image: pgvector/pgvector:pg16
    container_name: enterprise-rag-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_rag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-enterprise_rag}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - rag-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise-rag-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres-db
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    depends_on:
      postgres-db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - rag-network

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: enterprise-rag-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-UTC}
      - TZ=${TZ:-UTC}
      - N8N_SECURE_COOKIE=false
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - N8N_WEBHOOK_URL=${WEBHOOK_URL:-}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - api
    networks:
      - rag-network

volumes:
  postgres_data:
    driver: local
  n8n_data:
    driver: local

networks:
  rag-network:
    driver: bridge

